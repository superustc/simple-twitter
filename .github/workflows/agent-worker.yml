name: Isolated issue worker

on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: number
      provider:
        required: true
        type: string
      manual:
        required: true
        type: boolean
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

permissions: {}

jobs:
  implement:
    runs-on: ubuntu-22.04
    environment:
      name: OPENAI_API_KEY
      deployment: false
    timeout-minutes: 35
    permissions:
      contents: read
      issues: read
    env:
      ISSUE: ${{ inputs.issue }}
      PROVIDER: ${{ inputs.provider }}
      MANUAL: ${{ inputs.manual }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: policy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r policy/requirements.txt
      - name: Prepare issue prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$MANUAL" == true ]]; then flags+=(--manual); fi
          python policy/.github/agents/pipeline.py prompt "$ISSUE" "$RUNNER_TEMP/task.txt" "${flags[@]}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.provider != 'codex'
        with:
          node-version: '22'
      - name: Install selected optional worker
        if: inputs.provider != 'codex'
        run: |
          case "$PROVIDER" in
            claude) npm install -g @anthropic-ai/claude-code@2.1.323 ;;
            gemini) npm install -g @google/gemini-cli@0.68.0 ;;
            *) exit 1 ;;
          esac
      - name: Implement with Codex
        if: inputs.provider == 'codex'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: candidate
          prompt-file: ${{ runner.temp }}/task.txt
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-users: superustc
          allow-bot-users: github-actions[bot]
      - name: Implement with Claude Code
        if: inputs.provider == 'claude'
        working-directory: candidate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo 'Missing ANTHROPIC_API_KEY'; exit 1; }
          timeout 10m claude --bare -p --permission-mode acceptEdits \
            --tools 'Read,Glob,Grep,Edit,Write' --strict-mcp-config --mcp-config '{"mcpServers":{}}' \
            < "$RUNNER_TEMP/task.txt"
      - name: Implement with Gemini CLI
        if: inputs.provider == 'gemini'
        working-directory: candidate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY'; exit 1; }
          export GEMINI_CLI_SYSTEM_SETTINGS_PATH="$RUNNER_TEMP/gemini-settings.json"
          cp ../policy/.github/agents/gemini-settings.json "$GEMINI_CLI_SYSTEM_SETTINGS_PATH"
          timeout 10m gemini --approval-mode auto_edit --output-format text < "$RUNNER_TEMP/task.txt"
      - name: Export scoped patch
        id: patch
        continue-on-error: true
        run: |
          python policy/.github/agents/pipeline.py patch candidate "$GITHUB_SHA" "$RUNNER_TEMP/changes.patch"
      - name: Reset a rejected candidate
        if: steps.patch.outcome == 'failure' && inputs.provider == 'codex'
        run: |
          git -C candidate reset --hard "$GITHUB_SHA"
          git -C candidate clean -fdx
          printf '\nThe prior attempt had an empty or invalid patch. Return a scoped change using only the allowed paths.\n' >> "$RUNNER_TEMP/task.txt"
      - name: Retry rejected Codex patch once
        if: steps.patch.outcome == 'failure' && inputs.provider == 'codex'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: candidate
          prompt-file: ${{ runner.temp }}/task.txt
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-users: superustc
          allow-bot-users: github-actions[bot]
      - name: Enforce patch scope
        if: steps.patch.outcome == 'failure'
        run: python policy/.github/agents/pipeline.py patch candidate "$GITHUB_SHA" "$RUNNER_TEMP/changes.patch"
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-${{ inputs.issue }}-patch-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/changes.patch
            ${{ runner.temp }}/task.txt
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: implement
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-${{ inputs.issue }}-patch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Apply and check candidate
        run: |
          python .github/agents/pipeline.py patch . "$GITHUB_SHA" "$RUNNER_TEMP/candidate/changes.patch" --apply
          python -m compileall -q simple_twitter test_app.py run.py
          python -B test_app.py

  review:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: OPENAI_API_KEY
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-${{ inputs.issue }}-patch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Prepare independent review
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          python3 .github/agents/pipeline.py review "$ISSUE" \
            "$RUNNER_TEMP/candidate/changes.patch" "$RUNNER_TEMP/review-task.txt" \
            "$RUNNER_TEMP/candidate/task.txt"
      - name: Review candidate with Codex
        id: review
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/review-task.txt
          output-file: ${{ runner.temp }}/review.json
          permission-profile: ':read-only'
          allow-users: superustc
          allow-bot-users: github-actions[bot]
          output-schema: >-
            {"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested"]},
            "findings":{"type":"array","items":{"type":"string"}}},"required":["verdict","findings"],
            "additionalProperties":false}
      - name: Save reviewer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-${{ inputs.issue }}-review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce reviewer verdict
        run: |
          jq -e '.verdict == "approve" and .findings == []' "$RUNNER_TEMP/review.json" >/dev/null

  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-${{ inputs.issue }}-patch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Apply the verified patch
        run: python3 .github/agents/pipeline.py patch . "$GITHUB_SHA" "$RUNNER_TEMP/candidate/changes.patch" --apply
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          PROVIDER: ${{ inputs.provider }}
          MANUAL: ${{ inputs.manual }}
        run: |
          flags=()
          if [[ "$MANUAL" == true ]]; then flags+=(--manual); fi
          python3 .github/agents/pipeline.py publish . "$GITHUB_SHA" "$ISSUE" "$PROVIDER" "${flags[@]}"
