name: Issue to draft PR

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open issue number for a single Codex pilot. Use 0 for triage.'
        type: number
        default: 0
      run_approved:
        description: 'Run a batch of owner-labeled issues'
        type: boolean
        default: false
  schedule:
    - cron: '23 14 * * *'

permissions: {}

concurrency:
  group: issue-to-draft-pr
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'superustc/simple-twitter' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.actor == 'superustc' && github.triggering_actor == 'superustc'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      has_issues: ${{ steps.plan.outputs.has_issues }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan issues and reserve coding slots
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number || 0 }}
          EXECUTE: >-
            ${{ inputs.issue_number > 0 || inputs.run_approved ||
                (github.event_name == 'schedule' && vars.AGENT_AUTOMATION == 'true') }}
          WORKERS: ${{ vars.AGENT_WORKERS || 'codex' }}
        run: |
          flags=()
          if [[ "$EXECUTE" == true ]]; then flags+=(--execute); fi
          python3 .github/agents/pipeline.py plan "$RUNNER_TEMP/triage" "$ISSUE" "$WORKERS" "${flags[@]}"
      - name: Record the daily reservation
        if: steps.plan.outputs.has_jobs == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.plan.outputs.reservation }}
          path: ${{ runner.temp }}/triage/reservation.json
          retention-days: 7
          if-no-files-found: error
      - name: Save deterministic triage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-triage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/triage/triage.json
          retention-days: 30
          if-no-files-found: error
      - name: Save advisory prompt
        if: steps.plan.outputs.has_issues == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: triage-prompt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/triage/triage-prompt.txt
          retention-days: 7
          if-no-files-found: error

  advisory:
    needs: plan
    if: needs.plan.outputs.has_issues == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: triage-prompt-${{ github.run_attempt }}
      - name: Check advisory configuration
        id: config
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'AI advisory skipped. Deterministic triage is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Rank candidates with Codex
        id: advisory
        if: steps.config.outputs.enabled == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: triage-prompt.txt
          output-file: ${{ runner.temp }}/advisory.md
          permission-profile: ':read-only'
          allow-users: superustc
          allow-bot-users: github-actions[bot]
      - name: Save AI triage
        if: steps.advisory.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-triage-ai-${{ github.run_attempt }}
          path: ${{ runner.temp }}/advisory.md
          retention-days: 30
          if-no-files-found: error

  execute:
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/agent-worker.yml
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: read
    with:
      issue: ${{ matrix.issue }}
      provider: ${{ matrix.provider }}
      manual: ${{ inputs.issue_number > 0 }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
